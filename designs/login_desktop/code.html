<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Ambient Texture/Background Accent -->
<div class="fixed inset-0 pointer-events-none overflow-hidden opacity-50 mix-blend-multiply z-0">
<svg class="absolute inset-0 h-full w-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid-pattern" patternunits="userSpaceOnUse" width="40">
<path class="text-surface-variant" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid-pattern)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-[480px]">
<!-- Brand Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-xl text-headline-xl text-primary mb-stack-sm tracking-tight">Dayflow</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise Human Resources</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-primary p-stack-lg rounded shadow-[4px_4px_0px_0px_rgba(27,28,26,1)] transition-transform duration-300">
<form action="#" class="space-y-stack-md" method="POST">
<div class="border-b border-primary pb-stack-sm mb-stack-md">
<h2 class="font-label-md text-label-md text-primary uppercase">Secure Sign In</h2>
</div>
<!-- Input Group: ID/Email -->
<div class="group">
<label class="block font-label-sm text-label-sm text-on-surface mb-stack-sm" for="identifier">Employee ID or Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-primary rounded-DEFAULT focus:outline-none focus:ring-0 focus:border-tertiary-fixed-dim focus:border-b-2 transition-all duration-200 placeholder:text-on-surface-variant placeholder:opacity-50" id="identifier" name="identifier" placeholder="e.g. jdoe@company.com" required="" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="group">
<div class="flex justify-between items-center mb-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-1 underline-offset-2" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none">lock</span>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-primary rounded-DEFAULT focus:outline-none focus:ring-0 focus:border-tertiary-fixed-dim focus:border-b-2 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center items-center py-3 px-4 bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT border border-primary hover:bg-secondary hover:shadow-[4px_4px_0px_0px_rgba(27,28,26,0.2)] hover:-translate-y-0.5 active:translate-y-0 active:shadow-none transition-all duration-200 ease-out group/btn" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined ml-2 text-[18px] group-hover/btn:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- System Notice -->
<div class="text-center pt-stack-md mt-stack-md border-t border-surface-variant">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">shield_lock</span>
                        Authorized personnel only
                    </p>
</div>
</form>
</div>
</div>
</body></html>
